services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: edushare-postgres
    environment:
      POSTGRES_DB: edushare
      POSTGRES_USER: edushare_user
      POSTGRES_PASSWORD: edushare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - edushare-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edushare_user -d edushare"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Infrastructure Services
  seaweed-master:
    image: chrislusf/seaweedfs
    command: "master -ip=seaweed-master"
    ports:
      - "9333:9333"
    networks:
      - edushare-network
    restart: unless-stopped

  seaweed-volume:
    image: chrislusf/seaweedfs
    command: "volume -max=5 -mserver=seaweed-master:9333 -port=8080 -ip=seaweed-volume"
    ports:
      - "8080:8080"
    depends_on:
      - seaweed-master
    networks:
      - edushare-network
    restart: unless-stopped

  seaweed-filer:
    image: chrislusf/seaweedfs
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    ports:
      - "8888:8888"   # Filer API & UI 
      - "8111:8111"   # Optional metrics
    depends_on:
      - seaweed-master
      - seaweed-volume
    networks:
      - edushare-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - edushare-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend Service (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=edushare
      - DATABASE_USER=edushare_user
      - DATABASE_PASSWORD=edushare_password
      - SEAWEED_MASTER_URL=http://seaweed-master:9333
      - SEAWEED_FILER_URL=http://seaweed-filer:8888
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-SuperSecret123}
      - FRONTEND_URL=http://localhost:3001
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - AZURE_OCR_ENDPOINT=${AZURE_OCR_ENDPOINT:-}
      - AZURE_OCR_API_KEY=${AZURE_OCR_API_KEY:-}
      - DOCUMENT_POLL_INTERVAL_MS=${DOCUMENT_POLL_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweed-filer:
        condition: service_started
    networks:
      - edushare-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service (Next.js)
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      - backend
    networks:
      - edushare-network
    volumes:
      - ./front:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  edushare-network:
    driver: bridge

volumes:
  postgres_data: