services:
  seaweed-master:
    image: chrislusf/seaweedfs
    command: "master -ip=seaweed-master"
    ports:
      - "9333:9333"
    networks:
      - seaweed

  seaweed-volume:
    image: chrislusf/seaweedfs
    command: "volume -max=5 -mserver=seaweed-master:9333 -port=8080 -ip=seaweed-volume"
    ports:
      - "8080:8080"
    depends_on:
      - seaweed-master
    networks:
      - seaweed

  seaweed-filer:
    image: chrislusf/seaweedfs
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer"
    ports:
      - "8888:8888"   # Filer API & UI 
      - "8111:8111"   # Optional metrics
    depends_on:
      - seaweed-master
      - seaweed-volume
    networks:
      - seaweed

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - seaweed

networks:
  seaweed:
    driver: bridge