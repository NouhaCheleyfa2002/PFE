<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>
</head>
<body>
    <h1>Simple Button Test</h1>
    
    <button id="testBtn" onclick="handleClick()" style="padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer;">
        Test Button
    </button>
    
    <div id="output"></div>
    
    <script>
        function handleClick() {
            console.log('Button clicked!');
            document.getElementById('output').innerHTML = 'Button works! Check console.';
        }
    </script>
</body>
</html>
